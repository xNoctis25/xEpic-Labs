</head>
<body>
    <div class="app-layout">
        <aside class="app-sidebar">
            <div class="sidebar-nav top">
                <a href="#" class="nav-item active" title="N.O.V.A. Terminal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </a>
                <a href="#" class="nav-item" title="Insights">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
                </a>
                <a href="#" class="nav-item" title="Reports">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                </a>
                <a href="#" class="nav-item" title="Security">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
                </a>
                <a href="#" class="nav-item" title="Activity">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                </a>
            </div>
            <div class="sidebar-nav bottom">
                <a href="#" class="nav-item" title="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>

                <a href="#" class="nav-item" id="logoutBtn" title="Secure Sign Out">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </a>
            </div>
        </aside>

        <div class="glass-panel main-content">
            <h2>Dashboard</h2>
            <p class="subtitle">Protected Route Successfully Accessed</p>
            <div id="profileData" style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                <p style="color: var(--text-muted); margin-bottom: 10px; text-align: center;">Loading secure profile...</p>
            </div>
            <div class="nova-container">
                <div class="nova-messages" id="novaMessages">
                    <div class="nova-msg ai-msg"><strong>N.O.V.A.</strong><br>Greetings, How may I assist you?</div>
                </div>
                <form id="novaForm" class="gemini-input-container">
                    <input type="text" id="novaInput" placeholder="Ask N.O.V.A..." autocomplete="off" required>
                    <div class="gemini-controls" style="justify-content: flex-end;">
                        <div class="gemini-controls-right">
                            <div class="custom-model-dropdown disabled" id="modelDropdown">
                                <div class="dropdown-trigger" id="dropdownTrigger" title="Select Model">
                                    <span id="selectedModelText">Flash</span>
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"></path></svg>
                                </div>
                                <div class="dropdown-menu" id="dropdownMenu">
                                    <div class="dropdown-item active" data-value="gemini-2.5-flash">
                                        <div class="item-title">Flash</div>
                                        <div class="item-desc">Fast, everyday tasks</div>
                                    </div>
                                    <div class="dropdown-item" data-value="gemini-2.5-pro">
                                        <div class="item-title">Pro</div>
                                        <div class="item-desc">Deep logic &amp; reasoning</div>
                                    </div>
                                </div>
                            </div>
                            <input type="hidden" id="novaModelSelect" value="gemini-2.5-flash">
                            <button type="submit" id="novaSubmit" class="icon-btn" title="Send Command">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="/js/api.js?v=7.0"></script>
    <script src="/js/dashboard.js?v=7.0"></script>
</body>
</html>
