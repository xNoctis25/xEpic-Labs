<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xEpic Labs — Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cdefs%3E%3ClinearGradient id='m' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffffff'/%3E%3Cstop offset='40%25' stop-color='%23d1d8e0'/%3E%3Cstop offset='100%25' stop-color='%237a8594'/%3E%3C/linearGradient%3E%3Cfilter id='g'%3E%3CfeGaussianBlur stdDeviation='3' result='b'/%3E%3CfeMerge%3E%3CfeMergeNode in='b'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%3Cg%3E%3Cpath d='M25 20h20v80H25z' fill='url(%23m)'/%3E%3Cpath d='M45 20h55l-15 18H45z' fill='url(%23m)'/%3E%3Cpath d='M45 100h55l-15-18H45z' fill='url(%23m)'/%3E%3Cpath d='M65 42q0 18-23 18 23 0 23 18 0-18 23-18-23 0-23-18z' fill='%23ffffff' filter='url(%23g)'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="glass-panel" style="max-width: 500px;">
        <h2>Dashboard</h2>
        <p class="subtitle">Protected Route Successfully Accessed</p>
        <div id="profileData" style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px; margin-bottom: 20px;">
            <p style="color: var(--text-muted); margin-bottom: 10px; text-align: center;">Loading secure profile...</p>
        </div>
        <div class="nova-container">
            <div class="nova-messages" id="novaMessages">
                <div class="nova-msg ai-msg"><strong>N.O.V.A AI for xEpic Labs</strong><br>Greetings, How may I assist you?</div>
            </div>
            <form id="novaForm" class="gemini-input-container">
                <input type="text" id="novaInput" placeholder="Ask N.O.V.A..." autocomplete="off" required>
                <div class="gemini-controls">
                    <div class="gemini-controls-left">
                        <button type="button" class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
                        <button type="button" class="icon-btn with-text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg> Tools</button>
                    </div>
                    <div class="gemini-controls-right">
                        <select id="novaModelSelect" class="gemini-model-select" disabled>
                            <option value="gemini-2.5-flash">Flash</option>
                            <option value="gemini-2.5-pro">Pro</option>
                        </select>
                        <button type="button" class="icon-btn" onclick="document.getElementById('novaSubmit').click();"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg></button>
                        <button type="submit" id="novaSubmit" style="display:none;"></button>
                    </div>
                </div>
            </form>
        </div>
        <button id="logoutBtn" class="btn" style="background: rgba(255, 76, 76, 0.2); border: 1px solid var(--error); color: var(--error);">
            Secure Sign Out
        </button>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
