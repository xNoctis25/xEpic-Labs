<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xEpic Labs — Reset Password</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cdefs%3E%3ClinearGradient id='m' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffffff'/%3E%3Cstop offset='40%25' stop-color='%23d1d8e0'/%3E%3Cstop offset='100%25' stop-color='%237a8594'/%3E%3C/linearGradient%3E%3Cfilter id='g'%3E%3CfeGaussianBlur stdDeviation='3' result='b'/%3E%3CfeMerge%3E%3CfeMergeNode in='b'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%3Cg%3E%3Cpath d='M25 20h20v80H25z' fill='url(%23m)'/%3E%3Cpath d='M45 20h55l-15 18H45z' fill='url(%23m)'/%3E%3Cpath d='M45 100h55l-15-18H45z' fill='url(%23m)'/%3E%3Cpath d='M65 42q0 18-23 18 23 0 23 18 0-18 23-18-23 0-23-18z' fill='%23ffffff' filter='url(%23g)'/%3E%3C/g%3E%3C/svg%3E">
    <meta name="description" content="Reset your xEpic Labs account password.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/css/styles.css?v=15.0">
</head>
<body>
    <div class="glass-panel">
        <form id="otpForm">
            <h2 style="text-align: center; margin-bottom: 24px;">Enter Reset Code</h2>
            <div id="alertBoxOtp" class="alert" style="display: none;"></div>
            <p style="text-align: center; color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px; line-height: 1.5;">
                We sent a 6-digit code to your email.
            </p>
            <div class="form-group">
                <input type="text" id="resetOtp" required placeholder="6-Digit Code" maxlength="6" style="text-align: center; letter-spacing: 6px; font-size: 1.2rem; font-weight: bold;">
            </div>
            <button type="submit" class="btn" id="verifyOtpBtn" style="margin-top: 10px;">Verify Code</button>
            <p style="text-align: center; margin-top: 15px;">
                <a href="/index.html" class="forgot-link">Cancel</a>
            </p>
        </form>

        <form id="passwordForm" class="hidden">
            <h2 style="text-align: center; margin-bottom: 24px;">Set New Password</h2>
            <div id="alertBoxPwd" class="alert" style="display: none;"></div>
            <div class="form-group">
                <div class="password-wrapper">
                    <input type="password" id="newPassword" required placeholder="New Password">
                    <button type="button" class="eye-toggle" tabindex="-1">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <div class="password-wrapper">
                    <input type="password" id="confirmNewPassword" required placeholder="Confirm New Password">
                    <button type="button" class="eye-toggle" tabindex="-1">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn" id="resetSubmitBtn" style="margin-top: 10px;">Update Password</button>
        </form>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/reset.js?v=29.0"></script>
</body>
</html>
