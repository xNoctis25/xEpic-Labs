<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xEpic Labs — Reset Password</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cdefs%3E%3ClinearGradient id='m' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffffff'/%3E%3Cstop offset='40%25' stop-color='%23d1d8e0'/%3E%3Cstop offset='100%25' stop-color='%237a8594'/%3E%3C/linearGradient%3E%3Cfilter id='g'%3E%3CfeGaussianBlur stdDeviation='3' result='b'/%3E%3CfeMerge%3E%3CfeMergeNode in='b'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%3Cg%3E%3Cpath d='M25 20h20v80H25z' fill='url(%23m)'/%3E%3Cpath d='M45 20h55l-15 18H45z' fill='url(%23m)'/%3E%3Cpath d='M45 100h55l-15-18H45z' fill='url(%23m)'/%3E%3Cpath d='M65 42q0 18-23 18 23 0 23 18 0-18 23-18-23 0-23-18z' fill='%23ffffff' filter='url(%23g)'/%3E%3C/g%3E%3C/svg%3E">
    <meta name="description" content="Reset your xEpic Labs account password.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/css/styles.css?v=15.0">
</head>
<body>
    <div class="glass-panel" style="max-width:420px;">

        <!-- Brand Header -->
        <div class="brand">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="brand-logo">
              <defs>
                <linearGradient id="epicMetal" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="40%" stop-color="#d1d8e0" />
                  <stop offset="100%" stop-color="#7a8594" />
                </linearGradient>
                <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
                  <feGaussianBlur stdDeviation="3" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
                <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
                </filter>
              </defs>
              <g filter="url(#dropShadow)">
                <path d="M 25 20 L 45 20 L 45 100 L 25 100 Z" fill="url(#epicMetal)" />
                <path d="M 45 20 L 100 20 L 85 38 L 45 38 Z" fill="url(#epicMetal)" />
                <path d="M 45 100 L 100 100 L 85 82 L 45 82 Z" fill="url(#epicMetal)" />
                <path d="M 65 42 Q 65 60 42 60 Q 65 60 65 78 Q 65 60 88 60 Q 65 60 65 42 Z" fill="#ffffff" filter="url(#neonGlow)" />
              </g>
            </svg>
            <h1>xEpic Labs</h1>
            <p>Reset Your Password</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <p style="text-align:center; color:var(--text-muted); font-size:0.85rem; margin-bottom:24px; line-height:1.6;">
            If an account exists for that email, a 6-digit code has been sent.<br>
            <span style="font-size:0.78rem; opacity:0.7;">Check your spam folder if it doesn't arrive within a few minutes.</span>
        </p>

        <form id="resetForm" autocomplete="off">
            <div class="form-group">
                <input type="text" id="resetOtp" required maxlength="6" placeholder="6-Digit Code"
                       inputmode="numeric" pattern="\d{6}"
                       style="letter-spacing:6px; text-align:center; font-size:1.3rem; font-weight:600;">
            </div>
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="password" id="newPassword" required placeholder="New Password" autocomplete="new-password">
                    <button type="button" class="eye-btn" id="toggleNewPw" aria-label="Toggle password visibility">
                        <svg class="eye-icon" id="eyeNewOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-icon hidden" id="eyeNewClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="password" id="confirmNewPassword" required placeholder="Confirm New Password" autocomplete="new-password">
                    <button type="button" class="eye-btn" id="toggleConfirmPw" aria-label="Toggle password visibility">
                        <svg class="eye-icon" id="eyeConfirmNOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-icon hidden" id="eyeConfirmNClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
                <div class="match-text" id="resetMatchText"></div>
            </div>
            <button type="submit" class="btn" id="resetBtn">Change Password</button>
            <p class="text-center" style="margin-top:18px;">
                <a href="/" class="forgot-link">← Back to Sign In</a>
            </p>
        </form>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/reset.js"></script>
</body>
</html>
