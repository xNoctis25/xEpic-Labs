name: Deploy M.o.M Engine to ChicagoBot (Zero-Trust)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'engine/MoM/**'
      - '.github/workflows/chicagobot.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Wipe & prepare clean slate
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Stop engine if running
            pm2 stop mom-engine 2>/dev/null || true
            pm2 delete mom-engine 2>/dev/null || true
            # Full wipe — clean slate
            rm -rf ~/xEpic-Labs
            mkdir -p ~/xEpic-Labs/engine/MoM

      - name: Copy Engine to ChicagoBot
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "engine/MoM"
          target: "~/xEpic-Labs"

      - name: Install & Restart M.o.M
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Ensure Node.js 20 is installed
            if ! command -v npm &> /dev/null; then
              echo "Node.js not found. Installing now..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # 2. Install dependencies
            cd ~/xEpic-Labs/engine/MoM
            npm install

            # 3. Ensure PM2 is installed
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # 4. Restart engine
            echo "🤖 [CHICAGOBOT AWS] Executing Engine Deployment..."
            pm2 flush
            pm2 restart mom-engine --update-env || pm2 start npm --name "mom-engine" -- run start
            pm2 save