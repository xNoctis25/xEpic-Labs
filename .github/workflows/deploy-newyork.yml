name: Deploy to NewYorkCommand (Zero-Trust)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'engine/**'
      - '!engine/MoM/**'
      - '.github/workflows/deploy-newyork.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Write SSH Key
        run: |
          echo "${{ secrets.NYC_SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Sync Repo to NewYorkCommand (excludes engine/MoM)
        run: |
          rsync -avz --delete \
            --exclude='engine/MoM' \
            --exclude='.git' \
            --exclude='node_modules' \
            -e "ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key" \
            ./ root@${{ secrets.NYC_SERVER_IP }}:~/xEpic-Labs/

      - name: Execute Node/PM2 Setup for Auth Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.NYC_SERVER_IP }}
          username: root
          key: ${{ secrets.NYC_SSH_PRIVATE_KEY }}
          script: |
            if ! command -v node &> /dev/null || ! command -v npm &> /dev/null; then
              echo "Node.js not found. Installing now..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi
            cd ~/xEpic-Labs/backend/Auth
            npm install
            npm run build
            echo "🗽 [NEWYORKCOMMAND DO] Executing Auth Service Deployment..."
            pm2 flush
            pm2 restart auth-service --update-env || pm2 start dist/server.js --name "auth-service"
            pm2 save
